# Builds the macOS installers (.dmg) on GitHub's Mac machines and attaches them to the release.
# Runs when a release is published, or by hand (Actions -> "macOS release build" -> Run workflow).
name: macOS release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to (e.g. v0.2.0)"
        required: true

permissions:
  contents: write   # upload the .dmg to the release

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple silicon (M1 and later)
          - runner: macos-15-intel     # Intel Macs
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the .dmg
        env:
          SKIP_TESTS: ${{ matrix.runner == 'macos-15-intel' && '1' || '0' }}   # tests run once, on Apple silicon
        run: bash packaging/build_mac.sh "${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.runner }}
          path: dist/AmbientMood-*-mac-*.dmg
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/AmbientMood-*-mac-*.dmg --clobber
